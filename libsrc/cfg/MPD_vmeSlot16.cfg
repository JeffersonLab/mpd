    invert = true;
    pattern = "none";  // none, sync, deskew, ramp
    clock_phase = 46;	 // 0..63 (0.5 ns step)
  },
  {
    gain = [5, 5, 5, 5, 5, 5, 5, 5]; 	// (0...12 dB) gain settings for
    // sub-ch 0, 1, 2, ... 7
    invert = true;
    pattern = "none"; // none, sync, deskew, ramp
    clock_phase = 46;	 // 0..63 (0.5 ns step)
  }
    );

