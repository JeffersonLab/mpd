// -*- mode: c -*-

{
  fiberID = 0;

  rotary = 16;

  fir_enable= 0;
  fir_coeff = [10990, -2130, -169, -232, -147, -123, -98, -191, -88, 333, -3, 34, 17, 14, 11, 7]; // FIR filter coefficients 16bits (/2^13 to get "real" values)

